<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/favicon/favicon-16x16.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./scripts/templates.js" defer></script>
    <script src="./script.js" defer></script>
    <title>Pokedex</title>
  </head>
  <body onload="init()">
    <header>
      <div class="header_content">
        <h1>Pokedex</h1>
        <input id="pokemon_search" type="text" />
      </div>
    </header>
    <main>
      <div class="content" id="content"></div>
      <div class="direction_buttons">
        <button id="more_pokemons" onclick="getPrevPokemons()">prev</button>
        <button id="more_pokemons" onclick="getNextPokemons()">next</button>
      </div>
    </main>
    <dialog id="dialog" onclick="closeDialog()"></dialog>
    <footer>
      <h3>&copy; 2026 - gh</h3>
    </footer>
  </body>
</html>
